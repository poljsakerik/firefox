// Mirlumi's own features, kept out of upstream files so that a Firefox update rebases a few small hooks.
//
// The built-in web extensions in src/main/assets/extensions/ take their generated/ files from the packages in the mirlumi
// repository.

import groovy.json.JsonSlurper

import static org.mozilla.conventions.BuildConfigKt.updateExtensionVersion

plugins {
    id 'com.android.library'
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace = 'app.mirlumi'
    compileSdk {
        version = release(config.compileSdkMajorVersion) { minorApiLevel = config.compileSdkMinorVersion }
    }
    defaultConfig {
        minSdk config.minSdkVersion
        consumerProguardFiles "proguard-rules.pro"
    }
    buildFeatures {
        compose = true
    }
    androidResources {
        // manifest.template.json becomes manifest.json at build time.
        ignoreAssetsPattern = "manifest.template.json"
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    lint {
        lintConfig = file("../shared-lint.xml")
    }
}

mozilla {
    ktfmtSourcePaths = ["src/**/*.kt", "!**/build/**/*.kt"]
    detektSourcePaths = ["**/src/**/*.kt", "!**/build/**"]
    detektConfig = "$projectDir/../android-components/config/detekt.yml"
}

// A new version on every build, so GeckoView reinstalls each built-in extension and never runs older files.
def extensionVersionTasks = [
    "SafeSearch": "mirlumi-safe-search",
    "Allowlist": "mirlumi-allowlist",
    "ContentRules": "mirlumi-content-rules",
    "ImageCheck": "mirlumi-image-check",
].collect { name, dir ->
    def taskName = "update${name}ExtensionVersion"
    tasks.register(taskName, Copy) { task ->
        updateExtensionVersion(task, "src/main/assets/extensions/$dir", rootProject.ext.config.componentsVersion)
    }
    preBuild.dependsOn taskName
    taskName
}
// The lint tasks read the module directory that the manifests are written into.
tasks.matching { it.name.startsWith("spotless") || it.name.startsWith("detekt") }.configureEach {
    mustRunAfter extensionVersionTasks
}

// The committed debug private key can sign rules that keys/release.pem accepts while it's the placeholder copy, so no
// build that could be distributed may trust it. Only the debug build type is Mirlumi's development build.
def contentRulesConfig = file("src/main/assets/extensions/mirlumi-content-rules/generated/config.json")
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    inputs.file(contentRulesConfig)
    doFirst {
        if (new JsonSlurper().parse(contentRulesConfig).placeholderKey) {
            throw new GradleException("Content rules still trust the placeholder signing key. Create the real one first: " +
                "\"Signing keys\" in packages/content-rules/README.md in the mirlumi repository.")
        }
    }
}

dependencies {
    implementation project(':components:browser-state')
    implementation project(':components:compose-base')
    implementation project(':components:concept-engine')
    implementation project(':components:feature-contextmenu')
    implementation project(':components:lib-dataprotect')
    implementation project(':components:lib-state')
    implementation project(':components:support-base')
    implementation project(':components:support-webextensions')
    implementation project(':components:ui-icons')

    implementation libs.androidx.annotation
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.foundation
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.ui
    implementation libs.androidx.core.ktx
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.navigation.fragment
    implementation libs.androidx.preference

    // Runs the image check's model. Its ONNX file and model.json come from packages/image-check.
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.24.2"

    testImplementation libs.junit4
    testImplementation libs.androidx.test.core
    testImplementation libs.androidx.test.junit
    testImplementation libs.robolectric

    detektPlugins project(":components:tooling-detekt")
}
